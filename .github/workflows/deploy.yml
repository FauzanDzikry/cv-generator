name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: lowercase_repo
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          IMAGE_NAME: ${{ github.repository }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_NAME, VPS_APP_PATH, GH_ACTOR
          script: |
            # Masuk ke direktori aplikasi (pastikan folder dan docker-compose.yml sudah disiapkan di VPS)
            cd $VPS_APP_PATH
            
            # Memastikan nama image format huruf kecil (lowercase)
            IMAGE_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            export APP_IMAGE="ghcr.io/$IMAGE_LOWER:latest"
            
            # Autentikasi ke Container Registry menggunakan Personal Access Token
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u $GH_ACTOR --password-stdin
            
            # Unduh image versi terbaru
            docker compose pull
            
            # Restart container dengan image baru tanpa downtime panjang
            docker compose up -d
            
            # [Sangat Penting] Hapus sisa-sisa image dan layer yang tidak lagi digunakan untuk mencegah storage 20GB penuh
            docker image prune -a -f
