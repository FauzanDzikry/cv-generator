version: '3.8'

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/username/cv-generator:latest}
    restart: always
    ports:
      - "80:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-cv_gen}
      DB_USERNAME: ${DB_USERNAME:-cv_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db
    deploy:
      resources:
        # Batasan RAM maksimal untuk menghindari OOM Killer pada VPS 2GB
        limits:
          memory: 512M
        reservations:
          memory: 256M

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cv_gen}
      POSTGRES_USER: ${DB_USERNAME:-cv_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    deploy:
      resources:
        # Alokasi RAM yang memadai untuk Database PostgreSQL
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  db-data:
