services:
  app:
    container_name: cv-generator
    image: ${APP_IMAGE:-ghcr.io/fauzandzikry/cv-generator:latest}
    restart: always
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      # Menggunakan host.docker.internal atau default ke 172.17.0.1 (IP host di Docker Linux)
      DB_HOST: ${DB_HOST:-172.17.0.1}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-cv_gen}
      DB_USERNAME: ${DB_USERNAME:-cv_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        # Batasan RAM maksimal untuk menghindari OOM Killer pada VPS 2GB
        limits:
          memory: 512M
        reservations:
          memory: 256M
